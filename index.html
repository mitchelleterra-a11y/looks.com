<!doctype html>

    <link rel="stylesheet" href="./css/shoe.css" />

    <section class="products">
      <h1 class="products-title">Products Cart</h1>

      <div class="carousel">
        <!-- Hidden radio buttons remember which "page" of products is showing -->
        <input type="radio" name="page" id="page1" class="page-radio" checked />
        <input type="radio" name="page" id="page2" class="page-radio" />

        <div class="viewport">
          <div class="track">

              <div class="product-img">
                <img
                  src="./img/images 7.jpeg"
                  alt="Brown Nike sneaker on mustard fabric"
                />
                <button class="cart-btn" aria-label="Add to cart">
                  <svg
                    viewBox="0 0 24 24"
                    width="20"
                    height="20"
                    fill="none"
                    stroke="#2ee65a"
                    stroke-width="2.2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path
                      d="M2.5 4h2.6l2.3 10.4a1 1 0 0 0 1 .8h8.9a1 1 0 0 0 1-.8L20 8H6"
                    />
                    <circle cx="9.5" cy="19.5" r="1.4" />
                    <circle cx="16.5" cy="19.5" r="1.4" />
                  </svg>
                </button>
              </div>
              <div class="product-info">
                <span class="badge">New</span>
                <h3>Nike Air Max</h3>
                <div class="product-bottom">
                  <span class="price">$104</span>
                  <button class="buy-btn">Buy</button>
                </div>
              </div>
            </article>

        <!-- The arrows are labels: clicking one ticks its radio button -->
        <div class="arrows">
          <label for="page1" class="arrow prev" aria-label="Previous products">
            <svg
              viewBox="0 0 24 24"
              width="22"
              height="22"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="12" r="10" />
              <path d="M13 8 L9 12 L13 16" />
              <path d="M9 12 H16" />
            </svg>
          </label>
